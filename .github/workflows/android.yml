name: Android & Windows CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle (with dependency cache)
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
        gradle-home-cache-cleanup: true
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Locate Android NDK
      run: |
        NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)
        if [ -z "$NDK_DIR" ]; then
          echo "NDK not preinstalled, installing..."
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" >/dev/null
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)
        fi
        echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
        echo "Ndk = $NDK_DIR"
        go version || echo "no go"

    - name: Build BoringSSL (arm64-v8a, with ECH)
      run: |
        set -e
        git clone --depth 1 https://github.com/google/boringssl.git /tmp/bs
        cd /tmp/bs
        cmake -GNinja -B build-arm64 \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DBUILD_SHARED_LIBS=1 .
        ninja -C build-arm64 ssl crypto
        mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
        cp build-arm64/libssl.so build-arm64/libcrypto.so $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/
        ls -la $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/

    - name: Build Android Debug APK
      env:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
      run: |
        ./gradlew assembleDebug --no-daemon --parallel --build-cache --stacktrace 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}
    - name: Print compile errors (on failure)
      if: failure()
      run: |
        echo "========== 编译错误摘要 =========="
        grep -E '^e: |error: |Exception is:|Caused by:|> Task .* FAILED|FAILURE: Build failed' build.log | head -60 || echo "未匹配到标准错误行"
        echo "========== 日志末尾 100 行 =========="
        tail -100 build.log
    - name: Upload build log (on failure)
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: android-build-log
        path: build.log
    - name: Upload Android APK
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Cache Gradle & WiX
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/wix
        key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      shell: bash
    - name: Build Windows MSI (full) + Thin ZIP
      run: |
        ./gradlew :desktop:packageMsi :desktop:packageThinZip --stacktrace 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}
      shell: bash
    - name: Print compile errors (on failure)
      if: failure()
      shell: bash
      run: |
        echo "========== 编译错误摘要 =========="
        grep -E '^e: |error: |Exception is:|Caused by:|> Task .* FAILED|FAILURE: Build failed' build.log | head -60 || echo "未匹配到标准错误行"
        echo "========== 日志末尾 100 行 =========="
        tail -100 build.log
    - name: Upload build log (on failure)
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: windows-build-log
        path: build.log
    - name: Upload Windows MSI (full)
      if: success()
      uses: actions/upload-artifact@v5
      with:
        name: xdyl-windows-msi
        path: desktop/build/compose/binaries/main/msi/*.msi
    - name: Upload Windows Thin ZIP
      if: success()
      uses: actions/upload-artifact@v5
      with:
        name: xdyl-windows-thin-zip
        path: desktop/build/compose/binaries/main-thin/*.zip