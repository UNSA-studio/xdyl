name: Android & Windows CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Cache Gradle Wrapper
      uses: actions/cache@v4
      with:
        path: ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-wrapper-
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Android Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}
    - name: Print compile errors (on failure)
      if: failure()
      run: |
        echo "========== 编译错误摘要 =========="
        grep -E '^e: |error: |Exception is:|Caused by:|> Task .* FAILED|FAILURE: Build failed' build.log | head -60 || echo "未匹配到标准错误行"
        echo "========== 日志末尾 100 行 =========="
        tail -100 build.log
    - name: Upload build log (on failure)
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: android-build-log
        path: build.log
    - name: Upload Android APK
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Cache Gradle & WiX
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/wix
        key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', 'gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      shell: bash
    - name: Build Windows MSI (full) + Thin ZIP
      run: |
        ./gradlew :desktop:packageMsi :desktop:packageThinZip --stacktrace 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}
      shell: bash
    - name: Print compile errors (on failure)
      if: failure()
      shell: bash
      run: |
        echo "========== 编译错误摘要 =========="
        grep -E '^e: |error: |Exception is:|Caused by:|> Task .* FAILED|FAILURE: Build failed' build.log | head -60 || echo "未匹配到标准错误行"
        echo "========== 日志末尾 100 行 =========="
        tail -100 build.log
    - name: Upload build log (on failure)
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: windows-build-log
        path: build.log
    - name: Upload Windows MSI (full)
      if: success()
      uses: actions/upload-artifact@v5
      with:
        name: xdyl-windows-msi
        path: desktop/build/compose/binaries/main/msi/*.msi
    - name: Upload Windows Thin ZIP
      if: success()
      uses: actions/upload-artifact@v5
      with:
        name: xdyl-windows-thin-zip
        path: desktop/build/compose/binaries/main-thin/*.zip