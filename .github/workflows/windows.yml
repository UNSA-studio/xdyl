name: Windows Client

# 只在 windows/ 目录有改动时触发，避免 Android 每次提交都跑一遍
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # ---------- Rust 工具链：编译 nebula_core.dll ----------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/native/nebula_core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('windows/native/nebula_core/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build native core
        working-directory: windows/native/nebula_core
        run: cargo build --release --target x86_64-pc-windows-msvc

      # ---------- .NET 工具链 ----------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('windows/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        working-directory: windows
        run: dotnet restore NebulaUpdater.sln

      # ---------- 发布 ----------
      # 注意：跳过了 BuildNativeCore msbuild target（SkipNativeBuild=true），
      # 因为 rust 产物已经单独编译好，由下面这步手工拷进输出目录。
      - name: Publish (x64, self-contained)
        working-directory: windows
        run: |
          dotnet publish src/NebulaUpdater.App/NebulaUpdater.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:SkipNativeBuild=true `
            -p:PublishReadyToRun=true `
            -o publish-x64

      - name: Copy native dll into publish dir
        shell: pwsh
        run: |
          $dll = "windows/native/nebula_core/target/x86_64-pc-windows-msvc/release/nebula_core.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "nebula_core.dll 未生成，构建失败"
            exit 1
          }
          Copy-Item $dll "windows/publish-x64/nebula_core.dll" -Force
          Get-Item "windows/publish-x64/nebula_core.dll" | Select-Object Name, Length

      - name: Verify publish output
        shell: pwsh
        run: |
          $exe = "windows/publish-x64/NebulaUpdater.exe"
          if (-not (Test-Path $exe)) { Write-Error "NebulaUpdater.exe 缺失"; exit 1 }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "windows/publish-x64/*" -DestinationPath "artifacts/NebulaUpdater-portable-x64.zip"

      # ---------- MSI（WiX） ----------
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI
        working-directory: windows/installer/wix
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../../installer/out | Out-Null
          wix build Product.wxs `
            -arch x64 `
            -d PublishDir="${{ github.workspace }}\windows\publish-x64" `
            -d ProductVersion="1.0.0" `
            -o "${{ github.workspace }}\windows\installer\out\NebulaUpdater-1.0.0-x64.msi"
          Get-ChildItem ../../installer/out

      - name: Copy MSI to artifacts
        shell: pwsh
        run: |
          Copy-Item "windows/installer/out/*.msi" artifacts/ -Force
          Get-ChildItem artifacts

      # ---------- EXE（Inno Setup） ----------
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build EXE installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DPublishDir=${{ github.workspace }}\windows\publish-x64" `
                   "windows\installer\inno\NebulaUpdater.iss"
          Get-ChildItem windows\installer\out -Filter *.exe

      - name: Copy EXE installer to artifacts
        shell: pwsh
        run: |
          Get-ChildItem windows/installer/out -Filter *.exe | Copy-Item -Destination artifacts -Force
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xdyl-windows
          path: artifacts/*
          if-no-files-found: error
